name: Update profile statistics

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-profile.mjs
      - profile.template.md
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public GitHub data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/update-profile.mjs
      - name: Commit updated profile
        run: |
          if [ -z "$(git status --porcelain -- README.md data)" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md data
          git commit -m 'chore: refresh public profile statistics'
          git push

